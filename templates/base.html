{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Exama{% endblock title %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/favic.png' %}?v=2">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favic.png' %}?v=2">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .navbar .nav-links {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        @media (max-width: 1024px) {
            .navbar .nav-links {
                position: static;
                transform: none;
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar" style="position: relative;">
            <div class="logo-container" style="display: flex; align-items: center;">
                <a href="{% url 'home' %}" class="logo" >Exama</a>
            </div>
            <div class="nav-links">
                <a href="{% url 'home' %}">Accueil</a>
                <a href="{% url 'epreuves' %}">Épreuves</a>
                {% if user.is_authenticated %}
                    <span>{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit">Déconnexion</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Connexion</a>
                {% endif %}
            </div>

            <form
                action="{% url 'epreuves' %}"
                method="get"
                class="search-form"
            >
                <input
                    type="search"
                    name="q"
                    placeholder="Rechercher une épreuve..."
                    value="{{ recherche }}"
                >

                <button type="submit">
                    Rechercher
                </button>
            </form>

        </nav>
    </header>


    <main class="main-content">
        {% block content %}
        {% endblock content %}
    </main>


    <footer class="footer">
        <p>&copy; 2026 Exama · Banque d'épreuves</p>
    </footer>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
