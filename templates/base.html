{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Exama{% endblock title %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <a href="{% url 'home' %}" class="logo">
                Exama
            </a>

            <div class="nav-links">
                <a href="{% url 'home' %}">Accueil</a>
                <a href="{% url 'epreuves' %}">Épreuves</a>
            </div>

            <form
                action="{% url 'epreuves' %}"
                method="get"
                class="search-form"
            >
                <input
                    type="search"
                    name="q"
                    placeholder="Rechercher une épreuve..."
                    value="{{ recherche }}"
                >

                <button type="submit">
                    Rechercher
                </button>
            </form>

        </nav>
    </header>


    <main class="main-content">
        {% block content %}
        {% endblock content %}
    </main>


    <footer class="footer">
        <p>&copy; 2026 Exama · Banque d'épreuves</p>
    </footer>

</body>
</html>
