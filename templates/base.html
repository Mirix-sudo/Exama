{% load static %}

<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">

```
<!-- Adaptation aux téléphones -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Exama{% endblock title %}</title>

<!-- CSS global -->
<link rel="stylesheet" href="{% static 'css/style.css' %}">
```

</head>

<body>

```
<!-- ================= NAVBAR ================= -->
<nav class="navbar">

    <div class="logo">
        <a href="/">Exama</a>
    </div>

    <div class="menu">
        <a href="/">Accueil</a>
        <a href="/epreuves/">Épreuves</a>
        <a href="/recherche/">Recherche</a>
    </div>

    <!-- Recherche -->
    <form action="/recherche/" method="get" class="search-form">
        <input
            type="text"
            name="q"
            placeholder="Rechercher une épreuve..."
        >

        <button type="submit">
            Rechercher
        </button>
    </form>

</nav>


<!-- ================= CONTENU ================= -->

<main class="contenu">
    {% block content %}
    {% endblock content %}
</main>


<!-- ================= FOOTER ================= -->

<footer>
    <p>&copy; 2026 Exama · Banque d'épreuves</p>
</footer>
```

</body>
</html>
